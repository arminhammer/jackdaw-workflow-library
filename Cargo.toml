[package]
name = "jackdaw-workflow-library"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Reusable, composable workflows for the Jackdaw durable workflow engine (data/DuckDB, multi-source fetch)"
documentation = "https://docs.rs/jackdaw-workflow-library"
readme = "README.md"
repository = "https://github.com/arminhammer/jackdaw-workflow-library"
keywords = ["jackdaw", "workflow", "duckdb", "download", "orchestration"]
categories = ["asynchronous", "database", "network-programming"]
include = ["/src/**/*", "/tests/**/*", "/README.md", "/LICENSE"]

[lib]
name = "jackdaw_workflow_library"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Resumable, multi-source HTTP(S) and local file download workflows backed by gosh-dl.
fetch = ["dep:gosh-dl", "dep:jackdaw-wf", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio"]
# Enable all workflow categories.
full = ["fetch"]

[dependencies]
gosh-dl = { version = "0.6.3", default-features = false, features = ["http"], optional = true }
jackdaw-wf = { version = "0.2.5", default-features = false, features = ["redb"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"], optional = true }

[dev-dependencies]
cucumber = "0.21"
jackdaw-wf = { version = "0.2.5", default-features = false, features = ["redb"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "bdd"
harness = false
required-features = ["full"]

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "deny"
